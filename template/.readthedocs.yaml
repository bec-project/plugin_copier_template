version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install -e '.[docs]'
    build:
      html:
        - python -m zensical build --clean --config-file docs/zensical.toml
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -a docs/site/. "$READTHEDOCS_OUTPUT/html/"
